<!-- Design-system tokens + base + component styles -->

<link rel="stylesheet" href="_ds/crocodilesaucefc-design-system-82dccd68-cf7f-4f47-a4ee-1d1ab498695e/tokens/colors.css" />

<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: #04141a;
    color: var(--text-body);
    overflow-x: hidden;
  }
  #app { position: relative; z-index: 1; min-height: 100vh; }

  /* ---- Cinematic low-poly background stack ---- */
  .bg-photo {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: url('assets/bg_circuit.png') center / cover no-repeat;
    filter: brightness(1.06) saturate(1.05);
  }
  .bg-grad {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 26%, rgb(22 62 60 / 0.10) 0%, rgb(4 18 22 / 0.34) 48%, rgb(2 10 12 / 0.72) 80%, #000000 100%);
  }
  .vignette {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 58%, rgb(0 0 0 / 0.42) 100%);
  }

  /* ---- Hero floating mascot ---- */
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-0.4deg); } 50% { transform: translateY(-22px) rotate(0.4deg); } }
  @keyframes floatyShadow { 0%,100% { transform: scaleX(1); opacity: 0.45; } 50% { transform: scaleX(0.84); opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) {
    .float-croc, .float-shadow { animation: none !important; }
  }

  /* ---- Section scaffolding ---- */
  .section { position: relative; padding: 5rem 2.5rem; max-width: 1280px; margin: 0 auto; }
  .eyebrow {
    font-family: var(--font-display); font-size: 0.72rem; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--csfc-bronze); margin-bottom: 0.6rem;
  }
  .anchor { scroll-margin-top: 90px; }

  /* ---- Hero logo: keyed bronze nameboard ---- */
  .logo-board { position: relative; display: inline-block; width: min(100%, 660px);
    margin: 0 0 1.15rem; isolation: isolate; }
  .logo-board > img { position: relative; z-index: 1; display: block; width: 100%; height: auto;
    filter: drop-shadow(0 12px 26px rgb(0 0 0 / 0.6)) drop-shadow(0 2px 2px rgb(0 0 0 / 0.5)); }
  .logo-board-back { position: absolute; z-index: 0; inset: 13% 4.5%; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgb(2 10 14 / 0.78) 0%, rgb(2 10 14 / 0.42) 62%, rgb(2 10 14 / 0) 100%);
    filter: blur(7px); }

  /* ---- Responsive layout grids (inline styles can't hold media queries) ---- */
  .hero-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; align-items: center; gap: 1rem; }
  .hub-grid  { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 1.6rem; }
  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.9rem; }
  .store-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; }
  .about-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 3rem; align-items: center; }
  .nav-links { display: flex; gap: 1.9rem; align-items: center; }
  .nav-toggle { display: none; }

  @media (max-width: 980px) {
    .hero-grid { grid-template-columns: 1fr; gap: 2.5rem; }
    .hero-shield-col { justify-self: center !important; margin-top: 0; max-width: 420px !important; }
    .chef-stage { margin: 0 auto; }
    .hub-grid { grid-template-columns: 1fr; }
    .hub-col:first-child { border-right: none !important; padding-right: 0 !important;
      border-bottom: 1px solid var(--csfc-copper-30); padding-bottom: 1.6rem; margin-bottom: 0.4rem; }
    .about-grid { grid-template-columns: 1fr; }
    .about-grid > div:last-child { order: -1; max-width: 280px; margin: 0 auto; }
    .feature-grid { grid-template-columns: 1fr !important; gap: 1.8rem !important; }
    .feature-grid > div:last-child { order: -1; }
    .store-grid { grid-template-columns: repeat(3, 1fr); }
    .nav-links {
      position: absolute; top: 100%; right: 0; left: 0;
      flex-direction: column; align-items: flex-start; gap: 1.1rem;
      padding: 1.4rem 2.5rem;
      background: rgb(4 18 24 / 0.97); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--csfc-copper-30);
      transform: translateY(-8px); opacity: 0; pointer-events: none;
      transition: all 0.25s var(--ease-standard);
    }
    .nav-links.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .nav-toggle { display: inline-flex; }
    .footer-grid { grid-template-columns: 1fr 1fr !important; }
  }
  @media (max-width: 640px) {
    .section { padding: 3.5rem 1.2rem; }
    .hero-sec { padding: 1.5rem 1.2rem 3rem !important; min-height: auto !important; }
    .gallery-grid { grid-template-columns: 1fr 1fr; gap: 0.7rem; }
    .store-grid { grid-template-columns: 1fr 1fr; }
    .stat-grid { grid-template-columns: 1fr 1fr !important; }
    .header-pad { padding: 0.8rem 1.2rem !important; }
    .hub-panel-pad { padding: 1.1rem !important; }
    .footer-grid { grid-template-columns: 1fr !important; gap: 1.6rem !important; }
    .hide-sm { display: none !important; }
  }
  @media (max-width: 420px) {
    .gallery-grid, .store-grid { grid-template-columns: 1fr; }
    .hero-stats { gap: 1.3rem !important; }
  }
</style>
</head>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">

const DS = window.CrocodileSauceFCDesignSystem_82dccd;

const Chevron = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" width="100%" height="100%"><path d="M9 6l6 6-6 6" /></svg>;

/* ============================ HEADER ============================ */
function Header() {
  const links = ['Home', 'About', 'World Cup Hub', 'Viral Gallery', 'Store'];
  const [active, setActive] = React.useState('Home');
  const [open, setOpen] = React.useState(false);
  const slug = (l) => '#' + l.toLowerCase().replace(/ /g, '-');
  return (
    <header className="header-pad" style={{
      position: 'sticky', top: 0, zIndex: 60,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      gap: '2rem', padding: '0.9rem 2.5rem',
      background: 'linear-gradient(180deg, rgb(2 6 23 / 0.94), rgb(2 6 23 / 0.55))',
      backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)',
      borderBottom: '1px solid var(--csfc-copper-30)'
    }}>
      <a href="#home" onClick={() => setActive('Home')} style={{ display: 'flex', alignItems: 'center', gap: '0.8rem', textDecoration: 'none' }}>
        <img src={A + 'logo_medallion.png'} alt="CrocodileSauceFC crest" style={{ width: 46, height: 46, filter: 'drop-shadow(0 2px 6px rgb(0 0 0 / 0.6))' }} />
        <img src={A + 'wordmark.png'} alt="Crocodile Sauce F.C." style={{ height: 26, width: 'auto', filter: 'drop-shadow(0 2px 5px rgb(0 0 0 / 0.55))' }} />
      </a>

      <nav className={'nav-links' + (open ? ' open' : '')}>
        {links.map((l) =>
        <NavLink key={l} href={slug(l)} active={active === l}
        onClick={() => {setActive(l);setOpen(false);}}>{l}</NavLink>
        )}
        <span style={{ display: 'none' }} />
      </nav>

      <div style={{ display: 'flex', alignItems: 'center', gap: '0.7rem' }}>
        <span style={{ display: 'inline-block' }}><Button variant="cta" size="sm">Sign Up</Button></span>
        <span className="nav-toggle" style={{ width: 42, height: 42 }}>
          <IconButton label="Menu" variant="tactical" active={open} onClick={() => setOpen((o) => !o)}><Menu /></IconButton>
        </span>
      </div>
    </header>);

}

/* ====================== HERO HUD SHIELD bits ====================== */
function Flag({ a }) {
  return <span style={{ width: 40, height: 40, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
    fontSize: '1.7rem', background: 'var(--metal-bronze)', clipPath: 'polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)',

    <span style={{ filter: 'drop-shadow(0 1px 1px rgb(0 0 0 /.4))' }}>{a}</span></span>;
}
function StatRow({ label, value }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2,
      padding: '0.5rem 0.4rem', background: 'rgb(3 14 18 / 0.6)',

      <span style={{ fontFamily: 'var(--font-display)', fontSize: '0.55rem', letterSpacing: '0.14em',
        textTransform: 'uppercase', color: 'var(--csfc-text-muted)', whiteSpace: 'nowrap' }}>{label}</span>
      <span className="csfc-data" style={{ fontSize: '1.15rem', whiteSpace: 'nowrap' }}>{value}</span>
    </div>);

}
function Led({ style }) {return <span style={{ position: 'absolute', background: '#34d399', boxShadow: 'var(--led-emerald)', ...style }} />;}

/* ===== CHEF — animated mocap studio viewport (hero centerpiece) ===== */

        <Led style={{ bottom: '10%', left: '26%', width: 60, height: 3 }} />

        <div style={{ position: 'relative', overflow: 'hidden', aspectRatio: '3 / 4',

          <video src={A + 'chef_animated.mp4'} poster={A + 'chef_poster.png'}

          style={{ position: 'absolute', inset: 0, objectFit: 'cover', objectPosition: '50% 38%', width: "377px", height: "502px" }} />
          {/* teal tint to fold the studio grey into the palette */}

          {/* top status row */}

            <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.6rem', color: 'var(--csfc-text-muted)', letterSpacing: '0.1em', background: 'rgb(2 6 23 / 0.6)', padding: '0.18rem 0.4rem', border: '1px solid var(--csfc-copper-30)' }}>CAM&nbsp;01</span>

          <div style={{ position: 'absolute', left: 14, right: 14, bottom: 14 }}>
            <div style={{ fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: '1.15rem',
              letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--csfc-text-primary)',
              textShadow: '0 2px 10px rgb(0 0 0 / 0.9)' }}>“Chef”</div>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: '0.6rem', letterSpacing: '0.2em',
              textTransform: 'uppercase', color: 'var(--csfc-bronze)', marginTop: 3 }}>Captain · No. 10</div>
          </div>
        </div>
      </div>

}

function HudShield() {
  return (
    <div style={{ position: 'relative',
      borderStyle: 'solid', borderColor: 'transparent', borderWidth: 24,

      <Led style={{ top: '14%', right: -2, width: 3, height: 46 }} />
      <Led style={{ bottom: '12%', left: '24%', width: 56, height: 3 }} />
      <Led style={{ bottom: '12%', right: '24%', width: 56, height: 3 }} />
      <div style={{ position: 'relative', padding: '1.4rem 1.2rem 1.6rem', boxShadow: 'var(--bevel-inset)' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.9rem' }}>
          <Badge tone="emerald" pulse>Live · 67'</Badge>
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.6rem', color: 'var(--csfc-text-muted)', letterSpacing: '0.1em' }}>GRP&nbsp;A · MD3</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.9rem', marginBottom: '1.1rem' }}>
          <Flag a="🇦🇷" />
          <div style={{ textAlign: 'center', fontFamily: 'var(--font-display)', fontWeight: 700,
            fontSize: '0.9rem', letterSpacing: '0.1em', color: 'var(--csfc-text-primary)', lineHeight: 1.3 }}>
            ARGENTINA<br /><span style={{ color: 'var(--csfc-bronze)', fontSize: '0.7rem' }}>vs.</span><br />CANADA
          </div>
          <Flag a="🇨🇦" />
        </div>
        <div style={{ textAlign: 'center', fontFamily: 'var(--font-display)', fontSize: '0.7rem',

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.6rem' }}>
          <StatRow label="Goals" value="2 – 1" />
          <StatRow label="Possession" value="58–42" />

        <div style={{ display: 'flex', justifyContent: 'center', gap: '0.5rem', marginTop: '0.7rem' }}>

/* ============================== HERO ============================== */
function Hero() {
  return (
    <section id="home" className="anchor hero-sec" data-screen-label="Hero" style={{ position: 'relative', minHeight: '90vh', overflow: 'hidden',
      padding: '2.5rem 2.5rem 4rem', maxWidth: 1280, margin: '0 auto' }}>
      <div style={{ position: 'absolute', inset: 0, zIndex: 0, pointerEvents: 'none',

      <div className="hero-grid" style={{ position: 'relative', zIndex: 2 }}>

            <Badge tone="bronze">Low-Poly United</Badge>
          </div>
          <h1 className="logo-board">
            <span className="logo-board-back" aria-hidden="true"></span>
            <img src={A + 'wordmark_board.png'} alt="Crocodile Sauce F.C." />

          <p className="csfc-body" style={{ fontSize: '1.12rem', maxWidth: '42ch', margin: '0 0 1.9rem' }}>

/* ============================== ABOUT ============================== */
function About() {
  return (
    <section id="about" className="section anchor about-grid" data-screen-label="About">
      <GlassPanel clip="card" bracket padding="2.6rem">
        <div className="eyebrow">Est. 2026 · Low-Poly United</div>
        <h2 className="csfc-display-gradient" style={{ fontSize: '2.4rem', marginBottom: '1.1rem' }}>About The Squad</h2>
        <p className="csfc-body" style={{ fontSize: '1.08rem', marginBottom: '1rem' }}>
          CrocodileSauceFC is the world's first fully faceted football club — eleven low-poly reptiles forged in bronze and emerald, each carrying the signature hot-sauce crest into every World Cup fixture.
        </p>
        <p className="csfc-body" style={{ marginBottom: '1.7rem' }}>
          We broadcast live tactical HUDs, drop viral highlight reels by the hour, and outfit the faithful in the "Solid Poly Blank" kit line.
        </p>
        <div style={{ display: 'flex', gap: '0.8rem', flexWrap: 'wrap' }}>
          <Button variant="cta">Watch Highlights</Button>
          <Button variant="ghost" iconRight={<Chevron />}>Meet the roster</Button>
        </div>
      </GlassPanel>
      <div style={{ display: 'flex', justifyContent: 'center' }}>
        <img src={A + 'hero_croc.png'} alt="Squad mascot" style={{ width: '100%', maxWidth: 360,

      </div>
    </section>);

}

/* ====================== MATCH HUB (glassmorphism) ====================== */
function MatchHub() {

/* ======================= VIRAL GALLERY ======================= */
function GalleryTile({ c }) {
  const [hover, setHover] = React.useState(false);
  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
    style={{ transform: hover ? 'scale(1.04)' : 'scale(1)', transition: 'transform 0.35s var(--ease-out)',
      filter: hover ? 'drop-shadow(0 0 16px rgb(207 154 82 / 0.4))' : 'none', cursor: 'pointer' }}>
      <VideoTile {...c} />
    </div>);

}
function ViralGallery() {
  const [filter, setFilter] = React.useState('All');
  const filters = ['All', 'Goals', 'Saves', 'Skills', 'Tunnel'];
  const clips = [
  { title: 'Messi free-kick rocket', duration: '0:42', views: '2.4M views', badge: <Badge tone="emerald" pulse>Hot</Badge> },
  { title: 'Croc bicycle kick', duration: '0:18', views: '980K views' },
  { title: 'Last-minute winner', duration: '1:05', views: '5.1M views', badge: <Badge tone="bronze">Top</Badge> },
  { title: 'Keeper wonder save', duration: '0:27', views: '1.2M views' },
  { title: 'Tunnel walkout', duration: '0:33', views: '640K views' },
  { title: 'Trophy lift', duration: '0:51', views: '3.8M views', badge: <Badge tone="copper">New</Badge> }];

  return (
    <section id="viral-gallery" className="section anchor" data-screen-label="Viral Gallery">
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', flexWrap: 'wrap', gap: '1rem', marginBottom: '1.8rem' }}>
        <div>
          <div className="eyebrow">Viral Gallery</div>
          <h2 className="csfc-display-gradient" style={{ fontSize: 'clamp(2rem, 4vw, 3rem)' }}>Trending Clips</h2>
        </div>
        <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
          {filters.map((f) => <Tag key={f} selected={filter === f} onClick={() => setFilter(f)}>{f}</Tag>)}

      </div>
      <div className="gallery-grid">
        {clips.map((c, i) => <GalleryTile key={i} c={c} />)}
      </div>
    </section>);

}
